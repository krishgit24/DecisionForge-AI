[theme]
base = "light"
primaryColor = "#087F73"
backgroundColor = "#F0F5F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18312F"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "0.8rem"
buttonRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
chartCategoricalColors = ["#087F73", "#E59A3A", "#5064A8", "#C65B4B", "#4C8F73", "#8B6BAA"]
dataframeHeaderBackgroundColor = "#E5EFED"
dataframeHeaderTextColor = "#18312F"

[theme.sidebar]
backgroundColor = "#132D36"
secondaryBackgroundColor = "#1C3C45"
textColor = "#F3F7F6"
primaryColor = "#55D6B0"
linkColor = "#8DE8CE"
borderColor = "#31525A"
codeBackgroundColor = "#1C3C45"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "1.25rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
